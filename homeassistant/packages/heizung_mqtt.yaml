      state_class: measurement

    - name: "Pool WT RL"
      unique_id: heizung_temp_pool_wt_rl
      state_topic: "heizung/temp/pool_wt_rl/state"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Nebengebaeude VL"
      unique_id: heizung_temp_vl_nebengeb
      state_topic: "heizung/temp/vl_nebengeb/state"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Nebengebaeude RL"
      unique_id: heizung_temp_rl_nebengeb
      state_topic: "heizung/temp/rl_nebengeb/state"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Brauchwasser Oben"
      unique_id: heizung_temp_bw_oben
