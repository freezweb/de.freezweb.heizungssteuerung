automation:
  - alias: "Heizung Gebaeudeanforderungen an RevPi senden"
    id: heizung_sync_gebaeudeanforderungen_revpi
    description: "Schaltet die RevPi-MQTT-Anforderungsschalter aus den HA-Gesamtanforderungen fuer EG und OG."
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
      - platform: state
        entity_id:
          - sensor.heizanforderung_eg_prozent
          - sensor.heizanforderung_og_prozent
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.heizanforderung_eg_prozent') | float(0) > 0 }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.heizung_hauptsteuerung_anforderung_fbh_eg
        default:
          - service: switch.turn_off
            target:
              entity_id: switch.heizung_hauptsteuerung_anforderung_fbh_eg
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.heizanforderung_og_prozent') | float(0) > 0 }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.heizung_hauptsteuerung_anforderung_hk_backup
        default:
          - service: switch.turn_off
            target:
              entity_id: switch.heizung_hauptsteuerung_anforderung_hk_backup

  - alias: "Heizung HA Heartbeat"
    id: heizung_ha_heartbeat
    trigger:
      - platform: time_pattern
        seconds: "/60"
    action:
      - service: mqtt.publish
        data:
          topic: "heizung/ha/heartbeat"
          payload_template: "{{ now().timestamp() | int }}"

  - alias: "Heizung Oelbrenner Sicherheitsmeldungen Telegram"
    id: heizung_oelbrenner_stoerung_telegram
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id: binary_sensor.heizung_hauptsteuerung_oelbrenner_stoermeldung
        from: "off"
        to: "on"
        for: "00:00:02"
      - platform: state
        entity_id: binary_sensor.heizung_hauptsteuerung_oelbrenner_stoermeldung
        from: "on"
        to: "off"
        for: "00:00:02"
      - platform: state
        entity_id: binary_sensor.heizung_hauptsteuerung_oelbrenner_wasserdruck_stoerung
        from: "off"
        to: "on"
        for: "00:00:02"
      - platform: state
        entity_id: binary_sensor.heizung_hauptsteuerung_oelbrenner_wasserdruck_stoerung
        from: "on"
        to: "off"
        for: "00:00:02"
      - platform: state
        entity_id: binary_sensor.heizung_hauptsteuerung_oelbrenner_stb_stoerung
        from: "off"
        to: "on"
        for: "00:00:02"
      - platform: state
        entity_id: binary_sensor.heizung_hauptsteuerung_oelbrenner_stb_stoerung
        from: "on"
        to: "off"
        for: "00:00:02"
    action:
      - service: telegram_bot.send_message
        continue_on_error: true
        data:
          parse_mode: plain_text
          chat_id:
            - "-4649956506"
          message: >-
            {% set meldung = trigger.to_state.attributes.friendly_name | default(trigger.entity_id) %}
            {% if trigger.to_state.state == 'on' %}
            Heizung: {{ meldung }} erkannt.
            {% else %}
            Heizung: {{ meldung }} wieder OK.
            {% endif %}
            Betriebsmeldung: {{ states('binary_sensor.heizung_hauptsteuerung_oelbrenner_betriebsmeldung') }}.
            Zeit: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
      - service: persistent_notification.create
        data:
          title: >-
            {% if trigger.to_state.state == 'on' %}
            Heizung: Oelbrenner Stoerung
            {% else %}
            Heizung: Oelbrenner wieder OK
            {% endif %}
          message: >-
            {{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id) }} ist {{ 'aktiv' if trigger.to_state.state == 'on' else 'wieder OK' }}.

  - alias: "Heizung R421B16 Modbus Telegram"
    id: heizung_r421b16_modbus_telegram
    description: "Sendet die OK-Meldung nur, wenn vorher wirklich ein Stoeralarm verschickt wurde."
    mode: queued
    max: 5
    trigger:
      - platform: state
        id: down
        entity_id: binary_sensor.heizung_hauptsteuerung_r421b16_modbus_stoerung
        from: "off"
        to: "on"
        for: "00:00:10"
      - platform: state
        id: up
        entity_id: binary_sensor.heizung_hauptsteuerung_r421b16_modbus_stoerung
        from: "on"
        to: "off"
        for: "00:00:10"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'down' }}"
            sequence:
              - service: telegram_bot.send_message
                continue_on_error: true
                data:
                  parse_mode: plain_text
                  chat_id:
                    - "-4649956506"
                  message: >-
                    Heizung: R421B16 Keller-Relaismodul ist nicht erreichbar.
                    Fehler: {{ states('sensor.heizung_hauptsteuerung_r421b16_modbus_fehler') }}.
                    Zeit: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
              - service: persistent_notification.create
                data:
                  title: "Heizung: R421B16 Modbus Stoerung"
                  message: >-
                    Das Keller-Relaismodul 10.1.100.169 antwortet nicht auf den zyklischen Modbus-Statuspoll.
                    Fehler: {{ states('sensor.heizung_hauptsteuerung_r421b16_modbus_fehler') }}.
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.heizung_r421b16_modbus_alarm_gesendet
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'up' }}"
              - condition: state
                entity_id: input_boolean.heizung_r421b16_modbus_alarm_gesendet
                state: "on"
            sequence:
              - service: telegram_bot.send_message
                continue_on_error: true
                data:
                  parse_mode: plain_text
                  chat_id:
                    - "-4649956506"
                  message: >-
                    Heizung: R421B16 Keller-Relaismodul ist wieder erreichbar.
                    Zeit: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
              - service: persistent_notification.create
                data:
                  title: "Heizung: R421B16 Modbus wieder OK"
                  message: "Das Keller-Relaismodul antwortet wieder."
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.heizung_r421b16_modbus_alarm_gesendet
