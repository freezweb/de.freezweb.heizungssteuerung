mqtt:
  sensor:
    - name: "Heizung Gesamt VL Soll"
      unique_id: heizung_gesamt_vl_soll
      state_topic: "heizung/gesamt/vl_soll/state"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Heizung Failsafe Grund"
      unique_id: heizung_failsafe_grund
      state_topic: "heizung/failsafe/grund"

    - name: "Heizung Routing"
      unique_id: heizung_routing_json
      state_topic: "heizung/routing/state"
      value_template: "{{ value_json.common_demands | join(', ') if value_json.common_demands is defined else value }}"
      json_attributes_topic: "heizung/routing/state"

    - name: "Heizung VL Sammel"
      unique_id: heizung_temp_vl_sammel
      state_topic: "heizung/temp/vl_sammel/state"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Heizung RL Sammel"
      unique_id: heizung_temp_rl_sammel
      state_topic: "heizung/temp/rl_sammel/state"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Heizung Aussen"
      unique_id: heizung_temp_aussen
      state_topic: "heizung/temp/aussen/state"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Pool Wasser"
      unique_id: heizung_temp_pool_wasser
