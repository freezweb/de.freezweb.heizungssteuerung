    - name: "Hand Aktiv Brunnen FU Soll"
      unique_id: heizung_hauptsteuerung_hand_aktiv_brunnen_fu_soll
      state_topic: "heizung/brunnen_fu_soll/hand/mode/state"
      payload_on: "1"
      payload_off: "0"

  switch:
    - name: "Freigabe Oelbrenner"
      unique_id: heizung_freigabe_oelbrenner
      state_topic: "heizung/freigabe/quellen/oelbrenner/state"
      command_topic: "heizung/freigabe/quellen/oelbrenner/set"
      payload_on: "1"
      payload_off: "0"
      state_on: "1"
      state_off: "0"

    - name: "Freigabe WP1"
      unique_id: heizung_freigabe_wp1
