input_boolean:
  heizung_anf_fbh_eg:
    name: "Anforderung FBH EG"
  heizung_anf_klima_og:
    name: "Anforderung Klima OG"
  heizung_anf_nebengeb:
    name: "Anforderung Nebengebaeude"
  heizung_anf_pool:
    name: "Anforderung Pool"
  heizung_anf_bwwp:
    name: "Anforderung BWWP"

input_number:
  heizung_vl_fbh_eg:
    name: "VL Soll FBH EG"
    min: 20
    max: 55
    step: 0.5
    unit_of_measurement: "°C"
  heizung_vl_klima_og:
    name: "VL Soll Klima OG"
    min: 7
    max: 55
    step: 0.5
    unit_of_measurement: "°C"
  heizung_vl_nebengeb:
    name: "VL Soll Nebengebaeude"
    min: 20
    max: 55
    step: 0.5
    unit_of_measurement: "°C"
  heizung_vl_pool:
    name: "VL Soll Pool"
    min: 20
    max: 45
    step: 0.5
    unit_of_measurement: "°C"
  heizung_vl_bwwp:
    name: "VL Soll BWWP"
    min: 40
    max: 65
    step: 0.5
    unit_of_measurement: "°C"

script:
  heizung_publish_demands:
    alias: "Heizung Anforderungen senden"
    sequence:
      - service: mqtt.publish
        data:
          topic: "heizung/anforderung/fbh_eg/set"
          payload_template: >-
            {"aktiv": {{ is_state('input_boolean.heizung_anf_fbh_eg', 'on') | lower }},
             "vl_soll": {{ states('input_number.heizung_vl_fbh_eg') | float }},
             "quelle": "ha"}
      - service: mqtt.publish
        data:
          topic: "heizung/anforderung/klima_og/set"
          payload_template: >-
            {"aktiv": {{ is_state('input_boolean.heizung_anf_klima_og', 'on') | lower }},
             "vl_soll": {{ states('input_number.heizung_vl_klima_og') | float }},
             "quelle": "ha"}
      - service: mqtt.publish
        data:
          topic: "heizung/anforderung/nebengeb/set"
          payload_template: >-
            {"aktiv": {{ is_state('input_boolean.heizung_anf_nebengeb', 'on') | lower }},
             "vl_soll": {{ states('input_number.heizung_vl_nebengeb') | float }},
             "quelle": "ha"}
      - service: mqtt.publish
        data:
          topic: "heizung/anforderung/pool/set"
          payload_template: >-
            {"aktiv": {{ is_state('input_boolean.heizung_anf_pool', 'on') | lower }},
             "vl_soll": {{ states('input_number.heizung_vl_pool') | float }},
             "quelle": "ha"}
      - service: mqtt.publish
        data:
          topic: "heizung/anforderung/bwwp/set"
          payload_template: >-
            {"aktiv": {{ is_state('input_boolean.heizung_anf_bwwp', 'on') | lower }},
             "vl_soll": {{ states('input_number.heizung_vl_bwwp') | float }},
             "quelle": "ha"}

automation:
  - alias: "Heizung Anforderungen bei Aenderung senden"
    id: heizung_publish_demands_on_change
    trigger:
      - platform: state
        entity_id:
          - input_boolean.heizung_anf_fbh_eg
          - input_boolean.heizung_anf_klima_og
          - input_boolean.heizung_anf_nebengeb
          - input_boolean.heizung_anf_pool
          - input_boolean.heizung_anf_bwwp
          - input_number.heizung_vl_fbh_eg
          - input_number.heizung_vl_klima_og
          - input_number.heizung_vl_nebengeb
          - input_number.heizung_vl_pool
          - input_number.heizung_vl_bwwp
    action:
      - service: script.heizung_publish_demands

  - alias: "Heizung HA Heartbeat"
    id: heizung_ha_heartbeat
    trigger:
      - platform: time_pattern
        seconds: "/60"
    action:
      - service: mqtt.publish
        data:
          topic: "heizung/ha/heartbeat"
          payload_template: "{{ now().timestamp() | int }}"
