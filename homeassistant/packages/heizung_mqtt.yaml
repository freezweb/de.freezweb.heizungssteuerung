      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Brauchwasser Unten"
      unique_id: heizung_temp_bw_unten
      state_topic: "heizung/temp/bw_unten/state"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Brauchwasser Ladegrund"
      unique_id: heizung_brauchwasser_ladegrund
      state_topic: "heizung/brauchwasser/grund"

    - name: "Ausgang Brunnen FU Soll"
      unique_id: heizung_hauptsteuerung_ausgang_brunnen_fu_soll
      state_topic: "heizung/ao/brunnen_fu_soll/state"
      unit_of_measurement: "%"
      state_class: measurement

  binary_sensor:
    - name: "Heizung Gesamt Aktiv"
      unique_id: heizung_gesamt_active
      state_topic: "heizung/gesamt/active"
      payload_on: "1"
      payload_off: "0"

    - name: "Heizung Failsafe Aktiv"
      unique_id: heizung_failsafe_active
      state_topic: "heizung/failsafe/active"
      payload_on: "1"
      payload_off: "0"
      device_class: problem

    - name: "Brauchwasser Ladung Aktiv"
      unique_id: heizung_brauchwasser_ladung_aktiv
      state_topic: "heizung/brauchwasser/ladung_aktiv"
      payload_on: "1"
      payload_off: "0"

    - name: "Tor Fluegel Links Zu"
      unique_id: heizung_tor_fluegel_links_zu
      state_topic: "heizung/di/tor_fluegel_links_zu/state"
      payload_on: "1"
      payload_off: "0"

    - name: "Tor Fluegel Rechts Zu"
      unique_id: heizung_tor_fluegel_rechts_zu
      state_topic: "heizung/di/tor_fluegel_rechts_zu/state"
      payload_on: "1"
      payload_off: "0"

    - name: "Tor Lichtschranke"
      unique_id: heizung_tor_lichtschranke
      state_topic: "heizung/di/tor_lichtschranke/state"
